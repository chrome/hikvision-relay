[package]
name = "hikvision-relay"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "hikvision-relay"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "sync",
    "signal",
    "time",
    "io-util",
] }
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
parking_lot = "0.12"
libloading = "0.8"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
time = { version = "0.3", features = ["formatting", "macros"] }
urlencoding = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
