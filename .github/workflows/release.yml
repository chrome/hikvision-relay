name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: v0.1.0)"
        required: false
      name:
        description: "Release title"
        required: false
      prerelease:
        description: "Mark release as prerelease"
        required: false
        type: boolean
        default: false
      publish_release:
        description: "Publish GitHub release after build"
        required: false
        type: boolean
        default: false
      build_target:
        description: "Target platform to build"
        required: false
        type: choice
        default: all
        options:
          - all
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
          - x86_64-pc-windows-msvc
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - name: Resolve target selection
        shell: pwsh
        run: |
          $ShouldBuild = ("${{ github.event_name }}" -ne "workflow_dispatch") -or ("${{ github.event.inputs.build_target }}" -eq "all") -or ("${{ github.event.inputs.build_target }}" -eq "${{ matrix.target }}")
          "SHOULD_BUILD=$($ShouldBuild.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (-not $ShouldBuild) {
            Write-Host "Skipping target ${{ matrix.target }} (selected: ${{ github.event.inputs.build_target }})"
          }

      - name: Checkout
        if: env.SHOULD_BUILD == 'true'
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        if: env.SHOULD_BUILD == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux ARM64 cross toolchain
        if: env.SHOULD_BUILD == 'true' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Setup Zig for Linux ARM64 musl
        if: env.SHOULD_BUILD == 'true' && matrix.target == 'aarch64-unknown-linux-musl'
        uses: mlugg/setup-zig@v2

      - name: Install cargo-zigbuild
        if: env.SHOULD_BUILD == 'true' && matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo install cargo-zigbuild --locked

      - name: Build release binary (default)
        if: env.SHOULD_BUILD == 'true' && matrix.target != 'aarch64-unknown-linux-musl'
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Build release binary (musl via zig)
        if: env.SHOULD_BUILD == 'true' && matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}

      - name: Prepare packaged artifact (non-Windows)
        if: env.SHOULD_BUILD == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          APP_NAME="hikvision-relay"
          TARGET="${{ matrix.target }}"
          OUT_DIR="dist"
          mkdir -p "${OUT_DIR}"
          cp "target/${TARGET}/release/${APP_NAME}" "${OUT_DIR}/${APP_NAME}"
          ARCHIVE="${APP_NAME}-${TARGET}.tar.gz"
          tar -C "${OUT_DIR}" -czf "${ARCHIVE}" "${APP_NAME}"
          echo "ASSET_PATH=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Prepare packaged artifact (Windows)
        if: env.SHOULD_BUILD == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $AppName = "hikvision-relay"
          $Target = "${{ matrix.target }}"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item "target/$Target/release/$AppName.exe" "dist/$AppName.exe" -Force
          $Archive = "$AppName-$Target.zip"
          Compress-Archive -Path "dist/$AppName.exe" -DestinationPath $Archive -Force
          "ASSET_PATH=$Archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload artifact
        if: env.SHOULD_BUILD == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true')
    steps:
      - name: Validate release inputs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [ -z "${{ github.event.inputs.tag }}" ]; then
            echo "workflow_dispatch with publish_release=true requires 'tag' input"
            exit 1
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.name || format('Release {0}', github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name) }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prerelease || false }}
          files: artifacts/**/*
